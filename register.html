<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Freshers Party 2K26 | Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="registration">
<header class="topbar">
  <a class="logo" href="index.html"><span>TF</span><small>2026</small></a>
  <nav class="topnav"><a href="index.html#events">EVENTS</a><a href="index.html#schedule">SCHEDULE</a></nav>
  <a class="signin" href="index.html">← BACK</a>
</header>

<main class="reg-wrap"><div class="reg-panel">
<div class="reg-heading">
  <p class="mini" id="day"></p>
  <h1 id="name">EVENT REGISTRATION</h1>
  <p id="time"></p>
  <div class="last">LAST DATE: <b>13 OCTOBER 2026</b><small>Registration remains open for late entries.</small></div>
</div>

<form id="form">
  <input type="hidden" name="event" id="event">
  <div id="gameWrap"></div>
  <div id="fields"></div>
  <button id="submit" type="submit">SUBMIT REGISTRATION <span>↗</span></button>
  <p id="status"></p>
</form>
</div></main>

<script src="config.js"></script>
<script>
const E = {
  chess:["CHESS","15 OCTOBER 2026 • NON-TECH","1:00 PM – 2:00 PM","single"],
  "bgmi-free-fire-ludo":["BGMI / FREE FIRE / LUDO","15 OCTOBER 2026 • NON-TECH","2:00 PM – 3:30 PM","choice"],
  "murder-mystery-treasure-hunt":["MURDER MYSTERY / TREASURE HUNT","15 OCTOBER 2026 • NON-TECH","3:30 PM – 5:00 PM","team4"],
  "typing-speed":["TYPING SPEED","15 OCTOBER 2026 • TECH","10:00 AM – 11:00 AM","single"],
  "tech-escape-room":["TECH ESCAPE ROOM","15 OCTOBER 2026 • TECH","11:00 AM – 12:00 PM","duo"]
};

const slug = new URLSearchParams(location.search).get("event");
const x = E[slug];
if(!x) location.href="index.html";

document.getElementById("name").textContent=x[0];
document.getElementById("day").textContent=x[1];
document.getElementById("time").textContent=x[2];
document.getElementById("event").value=x[0];

const fields=document.getElementById("fields");
const gameWrap=document.getElementById("gameWrap");

function label(text,name,type="text",placeholder=""){
  return `<label>${text}<input name="${name}" type="${type}" ${placeholder?`placeholder="${placeholder}"`:""} required></label>`;
}

function renderSingle(){
  fields.innerHTML=`
    <div class="form-row">
      ${label("PARTICIPANT NAME","participantName")}
      ${label("GMAIL","participantEmail","email","name@gmail.com")}
    </div>
    ${label("MOBILE NUMBER","mobile","tel","10-digit mobile number")}
    <p class="form-note">This is a <b>single-player event</b>. Only one participant is required.</p>`;
}

function renderDuo(){
  fields.innerHTML=`
    ${label("TEAM NAME","teamName")}
    <div class="member-title">PLAYER 1</div>
    <div class="form-row">${label("PLAYER 1 NAME","player1Name")}${label("PLAYER 1 GMAIL","player1Email","email","name@gmail.com")}</div>
    <div class="member-title">PLAYER 2</div>
    <div class="form-row">${label("PLAYER 2 NAME","player2Name")}${label("PLAYER 2 GMAIL","player2Email","email","name@gmail.com")}</div>
    ${label("CAPTAIN MOBILE NUMBER","mobile","tel","10-digit mobile number")}
    <p class="form-note">This is a <b>2-player duo event</b>. Enter both players before submitting.</p>`;
}

function renderTeam4(){
  let members="";
  for(let i=1;i<=4;i++){
    members+=`<div class="member-title">PLAYER ${i}</div><div class="form-row">
      ${label(`PLAYER ${i} NAME`,`player${i}Name`)}
      ${label(`PLAYER ${i} GMAIL`,`player${i}Email`,"email","name@gmail.com")}
    </div>`;
  }
  fields.innerHTML=`
    ${label("TEAM / SQUAD NAME","teamName")}
    ${members}
    ${label("CAPTAIN MOBILE NUMBER","mobile","tel","10-digit mobile number")}
    <p class="form-note">This is a <b>4-player team event</b>. Enter all four players before submitting.</p>`;
}

function renderGameChoice(){
  gameWrap.innerHTML=`
    <label>CHOOSE GAME
      <select id="gameChoice" name="gameChoice" required>
        <option value="">Select your game</option>
        <option value="LUDO">LUDO — Single Player</option>
        <option value="BGMI">BGMI — 4 Player Team</option>
        <option value="FREE FIRE">FREE FIRE — 4 Player Team</option>
      </select>
    </label>`;
  fields.innerHTML=`<p class="form-note">Choose <b>Ludo</b> for a single-player registration, or <b>BGMI / Free Fire</b> for a 4-player team.</p>`;
  document.getElementById("gameChoice").addEventListener("change", e=>{
    const v=e.target.value;
    if(v==="LUDO"){
      document.getElementById("event").value="LUDO";
      renderSingle();
    }else if(v==="BGMI" || v==="FREE FIRE"){
      document.getElementById("event").value=v;
      renderTeam4();
    }else{
      document.getElementById("event").value=x[0];
      fields.innerHTML="";
    }
  });
}

if(x[3]==="single") renderSingle();
else if(x[3]==="duo") renderDuo();
else if(x[3]==="team4") renderTeam4();
else renderGameChoice();

function getMobile(){
  return document.getElementById("fields").querySelector('[name="mobile"]');
}

document.getElementById("form").addEventListener("input",e=>{
  if(e.target.name==="mobile") e.target.value=e.target.value.replace(/\D/g,"").slice(0,10);
});

document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const form=e.currentTarget, status=document.getElementById("status");
  const mobile=getMobile();

  if(!mobile || !/^[6-9]\d{9}$/.test(mobile.value)){
    status.textContent="Enter a valid 10-digit Indian mobile number.";
    status.className="err"; return;
  }

  if(!CONFIG.GOOGLE_SCRIPT_URL || CONFIG.GOOGLE_SCRIPT_URL.includes("PASTE_")){
    status.textContent="Connect the Google Sheet backend in config.js first.";
    status.className="err"; return;
  }

  const submit=document.getElementById("submit");
  submit.disabled=true; submit.textContent="SUBMITTING...";

  try{
    const payload=Object.fromEntries(new FormData(form).entries());
    delete payload.gameChoice;

    const response=await fetch(CONFIG.GOOGLE_SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify(payload),
      headers:{"Content-Type":"text/plain;charset=utf-8"}
    });

    const result=await response.json();
    if(!result.ok) throw Error(result.message||"Submission failed");

    status.textContent="Registration submitted successfully.";
    status.className="ok";
    form.reset();
    document.getElementById("event").value=x[0];
    if(x[3]==="choice") renderGameChoice();
  }catch(err){
    status.textContent="Submission failed. Please try again.";
    status.className="err";
  }finally{
    submit.disabled=false;
    submit.innerHTML='SUBMIT REGISTRATION <span>↗</span>';
  }
});
</script>
</body>
</html>
